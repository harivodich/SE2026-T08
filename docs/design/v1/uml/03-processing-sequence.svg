 x="402.5" dy="16">pinned)</tspan></text><line x1="310" y1="315" x2="495" y2="315" stroke="#405670" marker-end="url(#arrow)"/><text x="587.5" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="587.5" dy="0">TX: job QUEUED + outbox +</tspan><tspan x="587.5" dy="16">audit</tspan></text><line x1="495" y1="402" x2="680" y2="402" stroke="#405670" marker-end="url(#arrow)"/><text x="587.5" y="457" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="587.5" dy="0">COMMIT</tspan></text><line x1="680" y1="473" x2="495" y2="473" stroke="#405670" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="402.5" y="528" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="402.5" dy="0">job_id</tspan></text><line x1="495" y1="544" x2="310" y2="544" stroke="#405670" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="217.5" y="599" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="217.5" dy="0">202 Accepted</tspan></text><line x1="310" y1="615" x2="125" y2="615" stroke="#405670" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="772.5" y="670" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="772.5" dy="0">claim outbox row; read job</tspan></text><line x1="865" y1="686" x2="680" y2="686" stroke="#405670" marker-end="url(#arrow)"/><text x="957.5" y="741" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="957.5" dy="0">publish(job_id)</tspan></text><line x1="865" y1="757" x2="1050" y2="757" stroke="#405670" marker-end="url(#open)"/><text x="772.5" y="812" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="772.5" dy="0">mark delivered after</tspan><tspan x="772.5" dy="16">confirmation</tspan></text><line x1="865" y1="844" x2="680" y2="844" stroke="#405670" marker-end="url(#arrow)"/><text x="1142.5" y="899" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="1142.5" dy="0">deliver job_id</tspan></text><line x1="1050" y1="915" x2="1235" y2="915" stroke="#405670" marker-end="url(#open)"/><text x="865" y="970" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="865" dy="0">claim with lease/fencing token</tspan></text><line x1="1235" y1="986" x2="495" y2="986" stroke="#405670" marker-end="url(#arrow)"/><text x="587.5" y="1041" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="587.5" dy="0">CAS state + attempt/token</tspan></text><line x1="495" y1="1057" x2="680" y2="1057" stroke="#405670" marker-end="url(#arrow)"/><text x="20" y="1112" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#506D91"><tspan x="20" dy="0">alt — Claim accepted / fresh token</tspan></text><text x="1327.5" y="1147" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="1327.5" dy="0">canonical → OCR →</tspan><tspan x="1327.5" dy="16">extraction → checks</tspan></text><line x1="1235" y1="1179" x2="1420" y2="1179" stroke="#405670" marker-end="url(#arrow)"/><text x="865" y="1234" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="865" dy="0">heartbeat(token) during computation</tspan></text><line x1="1235" y1="1250" x2="495" y2="1250" stroke="#405670" marker-end="url(#arrow)"/><text x="1327.5" y="1305" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="1327.5" dy="0">payload + evidence +</tspan><tspan x="1327.5" dy="16">issues</tspan></text><line x1="1420" y1="1337" x2="1235" y2="1337" stroke="#405670" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="865" y="1392" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="865" dy="0">complete(job_id, token, result)</tspan></text><line x1="1235" y1="1408" x2="495" y2="1408" stroke="#405670" marker-end="url(#arrow)"/><text x="587.5" y="1463" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="587.5" dy="0">TX: validate token; UNIQUE</tspan><tspan x="587.5" dy="16">run/job; SUCCEEDED</tspan></text><line x1="495" y1="1495" x2="680" y2="1495" stroke="#405670" marker-end="url(#arrow)"/><text x="587.5" y="1550" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="587.5" dy="0">create head draft only if</tspan><tspan x="587.5" dy="16">head is null</tspan></text><line x1="495" y1="1582" x2="680" y2="1582" stroke="#405670" marker-end="url(#arrow)"/><text x="1142.5" y="1637" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="1142.5" dy="0">ACK after committed</tspan><tspan x="1142.5" dy="16">completion</tspan></text><line x1="1235" y1="1669" x2="1050" y2="1669" stroke="#405670" marker-end="url(#open)"/><line x1="15" y1="1724" x2="1530" y2="1724" stroke="#A5B5C9" stroke-dasharray="7 5"/><text x="20" y="1744" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#506D91"><tspan x="20" dy="0">else — Terminal / duplicate active delivery / stale token</tspan></text><text x="865" y="1774" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="865" dy="0">no-op or reject stale completion</tspan></text><line x1="495" y1="1790" x2="1235" y2="1790" stroke="#405670" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="1142.5" y="1845" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="1142.5" dy="0">ACK duplicate; no new</tspan><tspan x="1142.5" dy="16">committed run</tspan></text><line x1="1235" y1="1877" x2="1050" y2="1877" stroke="#405670" marker-end="url(#open)"/><rect x="25" y="1950" width="1495" height="37" rx="5" fill="#FFF3CE" stroke="#D7C28A"/><text x="40" y="1972" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="40" dy="0">Crash recovery: expired lease or lost delivery → bounded requeue; previous token cannot commit.</tspan></text><text x="217.5" y="2017" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="217.5" dy="0">GET job / run</tspan></text><line x1="125" y1="2033" x2="310" y2="2033" stroke="#405670" marker-end="url(#arrow)"/><text x="217.5" y="2088" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="217.5" dy="0">status; draft or candidate</tspan><tspan x="217.5" dy="16">result</tspan></text><line x1="310" y1="2120" x2="125" y2="2120" stroke="#405670" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="1097" width="1525" height="835" rx="4" fill="none" stroke="#A5B5C9"/></svg>