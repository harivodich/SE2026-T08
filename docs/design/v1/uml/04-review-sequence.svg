<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="2207" viewBox="0 0 1360 2207" role="img"><title>Sequence — sửa, approve, export</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405670"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#405670"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="30" y="38" text-anchor="start" font-family="Arial,sans-serif" font-size="22" fill="#243953"><tspan x="30" dy="0">Sequence — sửa, approve, export</tspan></text><text x="30" y="67" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#526C89"><tspan x="30" dy="0">Một payload revision bất biến; save/approve cạnh tranh dùng CAS; exporter không đọc latest prediction.</tspan></text><line x1="125" y1="154" x2="125" y2="2187" stroke="#ADBACE" stroke-dasharray="5 5"/><line x1="310" y1="154" x2="310" y2="2187" stroke="#ADBACE" stroke-dasharray="5 5"/><line x1="495" y1="154" x2="495" y2="2187" stroke="#ADBACE" stroke-dasharray="5 5"/><line x1="680" y1="154" x2="680" y2="2187" stroke="#ADBACE" stroke-dasharray="5 5"/><line x1="865" y1="154" x2="865" y2="2187" stroke="#ADBACE" stroke-dasharray="5 5"/><line x1="1050" y1="154" x2="1050" y2="2187" stroke="#ADBACE" stroke-dasharray="5 5"/><line x1="1235" y1="154" x2="1235" y2="2187" stroke="#ADBACE" stroke-dasharray="5 5"/><rect x="48" y="110" width="154" height="44" rx="8" fill="#E8F0FC" stroke="#7088A8"/><text x="125" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#243953"><tspan x="125" dy="0">Operator</tspan></text><rect x="233" y="110" width="154" height="44" rx="8" fill="#E8F0FC" stroke="#7088A8"/><text x="310" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#243953"><tspan x="310" dy="0">Review UI</tspan></text><rect x="418" y="110" width="154" height="44" rx="8" fill="#E8F0FC" stroke="#7088A8"/><text x="495" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#243953"><tspan x="495" dy="0">API</tspan></text><rect x="603" y="110" width="154" height="44" rx="8" fill="#E8F0FC" stroke="#7088A8"/><text x="680" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#243953"><tspan x="680" dy="0">Review service</tspan></text><rect x="788" y="110" width="154" height="44" rx="8" fill="#E8F0FC" stroke="#7088A8"/><text x="865" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#243953"><tspan x="865" dy="0">Validation</tspan></text><rect x="973" y="110" width="154" height="44" rx="8" fill="#E8F0FC" stroke="#7088A8"/><text x="1050" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#243953"><tspan x="1050" dy="0">PostgreSQL</tspan></text><rect x="1158" y="110" width="154" height="44" rx="8" fill="#E8F0FC" stroke="#7088A8"/><text x="1235" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#243953"><tspan x="1235" dy="0">Exporter</tspan></text><text x="217.5" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="217.5" dy="0">Edit fields/items; confirm</tspan><tspan x="217.5" dy="16">source</tspan></text><line x1="125" y1="212" x2="310" y2="212" stroke="#405670" marker-end="url(#arrow)"/><text x="402.5" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="402.5" dy="0">PATCH</tspan><tspan x="402.5" dy="16">review(base_revision,</tspan><tspan x="402.5" dy="16">expected_version)</tspan></text><line x1="310" y1="315" x2="495" y2="315" stroke="#405670" marker-end="url(#arrow)"/><text x="587.5" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="587.5" dy="0">authorized edit(payload,</tspan><tspan x="587.5" dy="16">reason)</tspan></text><line x1="495" y1="402" x2="680" y2="402" stroke="#405670" marker-end="url(#arrow)"/><text x="772.5" y="457" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="772.5" dy="0">schema + normalization +</tspan><tspan x="772.5" dy="16">semantic checks</tspan></text><line x1="680" y1="489" x2="865" y2="489" stroke="#405670" marker-end="url(#arrow)"/><text x="20" y="544" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#506D91"><tspan x="20" dy="0">alt — Payload valid and head/version current</tspan></text><text x="865" y="579" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="865" dy="0">TX: append revision + CAS head + audit</tspan></text><line x1="680" y1="595" x2="1050" y2="595" stroke="#405670" marker-end="url(#arrow)"/><text x="402.5" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="402.5" dy="0">201 new revision / version</tspan><tspan x="402.5" dy="16">/ issues</tspan></text><line x1="495" y1="682" x2="310" y2="682" stroke="#405670" stroke-dasharray="6 4" marker-end="url(#arrow)"/><line x1="15" y1="737" x2="1345" y2="737" stroke="#A5B5C9" stroke-dasharray="7 5"/><text x="20" y="757" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#506D91"><tspan x="20" dy="0">else — Stale version or invalid payload</tspan></text><text x="402.5" y="787" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="402.5" dy="0">409 conflict or 422</tspan><tspan x="402.5" dy="16">validation; preserve local</tspan><tspan x="402.5" dy="16">edits</tspan></text><line x1="495" y1="835" x2="310" y2="835" stroke="#405670" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="217.5" y="908" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="217.5" dy="0">Review all fields;</tspan><tspan x="217.5" dy="16">acknowledge warnings</tspan></text><line x1="125" y1="940" x2="310" y2="940" stroke="#405670" marker-end="url(#arrow)"/><text x="402.5" y="995" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="402.5" dy="0">POST approve(revision_id,</tspan><tspan x="402.5" dy="16">expected_version)</tspan></text><line x1="310" y1="1027" x2="495" y2="1027" stroke="#405670" marker-end="url(#arrow)"/><text x="587.5" y="1082" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="587.5" dy="0">approve snapshot</tspan></text><line x1="495" y1="1098" x2="680" y2="1098" stroke="#405670" marker-end="url(#arrow)"/><text x="772.5" y="1153" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="772.5" dy="0">revalidate current</tspan><tspan x="772.5" dy="16">payload; approval policy</tspan></text><line x1="680" y1="1185" x2="865" y2="1185" stroke="#405670" marker-end="url(#arrow)"/><text x="20" y="1240" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#506D91"><tspan x="20" dy="0">alt — No blockers; current head; warnings acknowledged</tspan></text><text x="865" y="1275" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="865" dy="0">TX: approval + version CAS + audit</tspan></text><line x1="680" y1="1291" x2="1050" y2="1291" stroke="#405670" marker-end="url(#arrow)"/><text x="402.5" y="1346" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="402.5" dy="0">201 approval</tspan></text><line x1="495" y1="1362" x2="310" y2="1362" stroke="#405670" stroke-dasharray="6 4" marker-end="url(#arrow)"/><line x1="15" y1="1417" x2="1345" y2="1417" stroke="#A5B5C9" stroke-dasharray="7 5"/><text x="20" y="1437" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#506D91"><tspan x="20" dy="0">else — Changed head / blocking issue / missing confirmation</tspan></text><text x="402.5" y="1467" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="402.5" dy="0">409 precondition / 422</tspan><tspan x="402.5" dy="16">invalid request</tspan></text><line x1="495" y1="1499" x2="310" y2="1499" stroke="#405670" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="402.5" y="1572" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="402.5" dy="0">POST export(explicit</tspan><tspan x="402.5" dy="16">revision_id)</tspan></text><line x1="310" y1="1604" x2="495" y2="1604" stroke="#405670" marker-end="url(#arrow)"/><text x="865" y="1659" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="865" dy="0">export_approved_revision</tspan></text><line x1="495" y1="1675" x2="1235" y2="1675" stroke="#405670" marker-end="url(#arrow)"/><text x="1142.5" y="1730" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="1142.5" dy="0">load immutable payload +</tspan><tspan x="1142.5" dy="16">approval</tspan></text><line x1="1235" y1="1762" x2="1050" y2="1762" stroke="#405670" marker-end="url(#arrow)"/><text x="1235" y="1817" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="1235" dy="0">serialize deterministic</tspan><tspan x="1235" dy="16">JSON; hash</tspan></text><path d="M 1235 1849 h 70 v 23 h -70" fill="none" stroke="#405670" marker-end="url(#arrow)"/><text x="1142.5" y="1904" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="1142.5" dy="0">record artifact keyed by</tspan><tspan x="1142.5" dy="16">revision/format/version</tspan></text><line x1="1235" y1="1936" x2="1050" y2="1936" stroke="#405670" marker-end="url(#arrow)"/><text x="402.5" y="1991" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="402.5" dy="0">artifact/download;</tspan><tspan x="402.5" dy="16">repeated export same bytes</tspan></text><line x1="495" y1="2023" x2="310" y2="2023" stroke="#405670" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="25" y="2078" width="1310" height="54" rx="5" fill="#FFF3CE" stroke="#D7C28A"/><text x="40" y="2100" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#243953"><tspan x="40" dy="0">Rerun is a separate candidate. Save/adopt after approval creates a new draft; old approved</tspan><tspan x="40" dy="16">export remains tied to old revision.</tspan></text><rect x="10" y="529" width="1340" height="361" rx="4" fill="none" stroke="#A5B5C9"/><rect x="10" y="1225" width="1340" height="329" rx="4" fill="none" stroke="#A5B5C9"/></svg>