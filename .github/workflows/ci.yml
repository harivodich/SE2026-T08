name: VietDoc CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vietdoc-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow:
    name: workflow-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate workflow syntax and security
        run: python3 -m scripts.ci.lint

  contracts:
    name: schemas-and-gate-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the independent schema validator environment
        run: python -m pip install -r .github/contract-requirements.txt
      - name: Validate shared schemas with positive and negative cases
        run: python -m scripts.ci.checks tests contracts
      - name: Verify gate failure, cancellation and skip policy
        run: python -m scripts.ci.checks tests ci

  ai:
    name: ai-fixture-tests
    env:
      VIETDOC_CONTRACTS_DIR: ${{ github.workspace }}/specs/contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Fresh install the combined AI1 and AI2 fixture environment
        run: python -m pip install ".[serve,test,ai1]" numpy==2.2.6
      - name: Install CPU torch for loss and gradient regression tests
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
      - name: Check AI dependency consistency
        run: python -m pip check
      - name: Run AI suites with inventory and strict skip policy
        run: python -m scripts.ci.ai --junitxml=test-results/ai.xml
      - name: Upload AI fixture test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ai-tests-${{ github.sha }}
          path: test-results/ai.xml
          if-no-files-found: error
          retention-days: 7

  data:
    name: data-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools
        run: python -m pip install -c .github/ci-constraints.txt setuptools wheel
      - name: Fresh install the declared Data extra
        run: python -m pip install --no-build-isolation -c .github/ci-constraints.txt ".[data]"
      - name: Run portable Data regression tests
        run: python -m scripts.ci.checks tests data --separate-pdf
      - name: Generate and verify twenty fictional samples
        run: python -m scripts.ci.checks integration
      - name: Check tracked fixtures were not changed
        run: git diff --exit-code

  data-pdf:
    name: data-pdf-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install independent PDF parser and renderer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
          pdfinfo -v
          pdfimages -v
          pdftoppm -v
      - name: Install build tools
        run: python -m pip install -c .github/ci-constraints.txt setuptools wheel
      - name: Fresh install the declared Data extra
        run: python -m pip install --no-build-isolation -c .github/ci-constraints.txt ".[data]"
      - name: Verify generated PDFs with Poppler; no skipped tests permitted
        run: python -m scripts.ci.checks tests pdf
      - name: Check tracked fixtures were not changed
        run: git diff --exit-code

  package:
    name: data-package-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -c .github/ci-constraints.txt setuptools wheel
      - name: Build and test an installed wheel outside the source checkout
        run: python -m scripts.ci.checks package
      - name: Upload the tested Data wheel and its provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: data-wheel-${{ github.sha }}
          path: |
            dist/*.whl
            dist/data-package.json
          if-no-files-found: error
          retention-days: 7

  test:
    name: web-java-package-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Web tests
        run: node --test
        working-directory: backend/src/test/js
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Java tests
        run: bash mvnw -B test
        working-directory: backend
      - name: Package application
        run: bash mvnw -B -DskipTests package
        working-directory: backend
      - name: Check packaged web assets
        run: |
          jar tf backend/target/vietdoc-backend-1.0.0.jar > jar-contents.txt
          for asset in templates/index.html static/app.js static/api.js static/domain.js static/styles.css; do
            grep -Fx "BOOT-INF/classes/$asset" jar-contents.txt
          done
      - name: Bind tested JAR and strict JUnit evidence to this source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          python3 -m scripts.ci.application capture
          --jar backend/target/vietdoc-backend-1.0.0.jar
          --reports backend/target/surefire-reports
          --receipt backend/target/build-receipt.json --sha "$SOURCE_SHA"
      - name: Upload the tested Java application, not a rebuilt copy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: java-application-${{ github.sha }}
          path: |
            backend/target/vietdoc-backend-1.0.0.jar
            backend/target/build-receipt.json
            backend/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 7

  backend:
    name: backend-release-evidence
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: java-application-${{ github.sha }}
          path: backend/target
      - name: Reject missing, failed or skipped backend evidence and changed artifact
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          python3 -m scripts.ci.application verify
          --jar backend/target/vietdoc-backend-1.0.0.jar
          --reports backend/target/surefire-reports
          --receipt backend/target/build-receipt.json --sha "$SOURCE_SHA"

  parity:
    name: java-python-contract-parity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate corpus through the real Java consumer
        run: bash mvnw -B -Dtest=ContractParityTest test
        working-directory: backend
      - name: Install the Python contract consumer
        run: python -m pip install ".[contracts]"
      - name: Compare Python outcomes to actual Java results and independent oracles
        run: python -m scripts.ci.parity

  application-artifact:
    name: tested-application-artifact-smoke
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: java-application-${{ github.sha }}
          path: backend/target
      - name: Verify and boot the exact tested JAR without rebuilding
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          python3 -m scripts.ci.application smoke
          --jar backend/target/vietdoc-backend-1.0.0.jar
          --reports backend/target/surefire-reports
          --receipt backend/target/build-receipt.json --sha "$SOURCE_SHA"

  e2e:
    name: actual-native-provider-and-v1-acceptance
    needs: [test, backend, parity]
    if: >-
      ${{ github.event.pull_request.base.ref == 'main' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: vietdoc_native_e2e
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: isolated-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d vietdoc_native_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      VIETDOC_PG_TEST_USER: integration
      VIETDOC_PG_TEST_PASSWORD: isolated-ci-test-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: java-application-${{ github.sha }}
          path: backend/target
      - name: Install native CPU runtime with pinned OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1 libgl1
          python -m pip install ".[serve,ai1-ocr]"
      - name: Run real Java, PostgreSQL, native OCR and review/export
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          python -m scripts.ci.native_e2e
          --jar backend/target/vietdoc-backend-1.0.0.jar
          --run-root "$RUNNER_TEMP/vietdoc-native-e2e"
          --database-url jdbc:postgresql://127.0.0.1:5432/vietdoc_native_e2e --sha "$SOURCE_SHA"
      - name: Require frozen final quality and actual candidate evidence too
        run: python -m scripts.ci.acceptance

  docker-smoke:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build image from repository root
        run: docker build -f backend/Dockerfile -t vietdoc-web-smoke .
      - name: Start demo container
        id: container
        run: docker run -d --name vietdoc-web-smoke -p 18080:8080 -e SPRING_PROFILES_ACTIVE=demo -e WORKER_ENABLED=false vietdoc-web-smoke
      - name: Check rendered page and static assets
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:18080/ -o index.html; then break; fi
            if [ "$attempt" -eq 40 ]; then exit 1; fi
            sleep 2
          done
          grep -q 'name="_csrf"' index.html
          for asset in app.js api.js domain.js styles.css; do
            curl -fsS "http://localhost:18080/$asset" -o /dev/null
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/api/v1/auth/me)" = 401
      - name: Container logs on failure
        if: failure() && steps.container.outcome == 'success'
        run: docker logs vietdoc-web-smoke
      - name: Stop demo container
        if: always()
        run: docker rm -f vietdoc-web-smoke || true

  postgres:
    name: postgres-job-lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: vietdoc
          POSTGRES_USER: vietdoc
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vietdoc -d vietdoc"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      VIETDOC_PG_TEST_URL: jdbc:postgresql://localhost:5432/vietdoc
      VIETDOC_PG_TEST_USER: vietdoc
      VIETDOC_PG_TEST_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Record migration fingerprint
        run: sha256sum backend/src/main/resources/db/migration/*.sql
      - name: Run real PostgreSQL Flyway and job concurrency test
        run: bash mvnw -B -Dtest=PostgresJobIT test
        working-directory: backend

  release-readiness:
    name: release-readiness
    needs: [workflow, contracts, data, data-pdf, package, ai, test, docker-smoke, postgres, backend, parity, e2e, application-artifact]
    if: >-
      ${{ always() &&
      (github.event.pull_request.base.ref == 'main' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require real application release checks
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -m scripts.ci.gate release

  ci-gate:
    name: ci-gate
    needs: [workflow, contracts, data, data-pdf, package, ai, test, docker-smoke, postgres, backend, parity, application-artifact, release-readiness]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fail closed on missing, failed, skipped or cancelled required jobs
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -m scripts.ci.gate ci
