[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietdoc"
version = "0.0.1"
description = "Vietnamese document extraction and human review"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["Pillow==10.2.0", "jsonschema==4.10.3"]

[tool.setuptools.package-data]
"vietdoc.data.generator" = ["fake-values.json", "d21.json"]

[tool.setuptools.packages.find]
where = ["src"]
