[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietdoc"
version = "0.0.1"
description = "Vietnamese document extraction and human review"
requires-python = ">=3.11"
# Core: shared-contract validation only. Web and model frameworks live in extras
# so contracts/offline tools do not pull FastAPI or torch.
dependencies = [
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
# Private compute service (inference process, CPU-first).
serve = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
]
# Offline training/spike environment. Install torch first from the wheel index
# matching the hardware (CPU: https://download.pytorch.org/whl/cpu).
train = [
  "torch==2.14.1",
  "transformers==5.20.2",
  "peft==0.21.2",
  "accelerate==1.15.0",
  "safetensors==0.8.0",
  "pillow==13.0.0",
]
test = [
  "pytest==9.1.1",
  "httpx2==2.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
