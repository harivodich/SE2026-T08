[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietdoc"
version = "0.0.1"
description = "Vietnamese document extraction and human review"
requires-python = ">=3.11"
# Dependencies belong to the environment that uses them. In particular, the
# historical Data renderer must not inherit the modern compute validator.
dependencies = []

[project.optional-dependencies]
ai1 = ["Pillow==12.0.0", "pypdfium2==5.14.0"]
ai1-ocr = [
    "Pillow==12.0.0", "pypdfium2==5.14.0", "numpy==2.2.6",
    "paddleocr==3.3.2", "paddlex[ocr-core]==3.3.13", "paddlepaddle==3.3.1", "tesserocr==2.12.0",
    "opencv-contrib-python==4.10.0.84", "shapely==2.2.0", "pyclipper==1.4.0",
]
# Keep these validator pins aligned in contracts/serve/train. Explicit lists
# also work during the Docker dependency layer, before application source exists.
contracts = [
  "jsonschema==4.26.0",
  "referencing==0.37.0",
]
# Private compute service (inference process, CPU-first).
serve = [
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
]
# Offline training/spike environment. Install torch first from the wheel index
# matching the hardware (CPU: https://download.pytorch.org/whl/cpu).
train = [
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "torch==2.14.1",
  "transformers==5.20.2",
  "peft==0.21.2",
  "accelerate==1.15.0",
  "safetensors==0.8.0",
  "pillow==13.0.0",
]
test = [
  "pytest==9.1.1",
  "httpx2==2.16.0",
  # Local, noneditable wheel smoke in the AI gate (same build pins as Data CI).
  "setuptools==75.8.0",
  "wheel==0.45.1",
]
data = [
  "Pillow==10.2.0",
  "jsonschema==4.10.3",
]

[tool.setuptools.package-data]
"vietdoc.data.generator" = ["fake-values.json", "d21.json", "d22.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
