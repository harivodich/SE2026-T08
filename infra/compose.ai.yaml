# AI-2 Python services only. Java app/job-runner/postgres Compose belongs to Backend (B7.1).
#   docker compose -f infra/compose.ai.yaml up -d --build ai-service
#   docker compose -f infra/compose.ai.yaml --profile train run --rm ai-train
# Paths are relative to this file. Copy infra/.env.example to infra/.env to override.
name: vietdoc-ai

services:
  # Shared Compose change: Backend review required. Opt-in, never a dependency of serving.
  model-download:
    profiles: ["setup"]
    build:
      context: ..
      dockerfile: infra/model-download.Dockerfile
    image: vietdoc-model-download:dev
    environment:
      VIETDOC_QWEN_PROVISION_APPROVAL: ${VIETDOC_QWEN_PROVISION_APPROVAL:-}
      VIETDOC_QWEN_LICENSE_ACK: ${VIETDOC_QWEN_LICENSE_ACK:-}
    volumes:
      - type: bind
        source: ${VIETDOC_MODELS_DIR:-../artifacts/models}/qwen/qwen3-1.7b
        target: /provision
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 1g

  ai-service:
    build:
      context: ..
      dockerfile: infra/ai-service.Dockerfile
      target: runtime
    image: vietdoc-ai-service:dev
    environment:
      VIETDOC_SERVICE_TOKEN_FILE: /run/secrets/ai_service_token
      VIETDOC_PIPELINE_MANIFEST_ID: ${VIETDOC_PIPELINE_MANIFEST_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    secrets:
      - ai_service_token
    ports:
      # Loopback only; the service is private and never public.
      - "127.0.0.1:${AI_SERVICE_PORT:-8090}:8090"
    volumes:
      - type: bind
        source: ${VIETDOC_MODELS_DIR:-../artifacts/models}
        target: /models
        read_only: true
      - ai-attempts:/attempts
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: ${AI_SERVICE_CPUS:-2}
    mem_limit: ${AI_SERVICE_MEMORY:-4g}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ai-train: &train
    profiles: ["train"]
    build:
      context: ..
      dockerfile: infra/ai-train.Dockerfile
    image: vietdoc-ai-train:dev
    environment: &train-env
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HOME: /tmp/huggingface
      VIETDOC_CHECKPOINTS_DIR: /checkpoints
    # No network by default: no implicit model/dataset downloads.
    network_mode: none
    volumes: &train-volumes
      - type: bind
        source: ${VIETDOC_MODELS_DIR:-../artifacts/models}
        target: /models
        read_only: true
      - type: bind
        source: ${VIETDOC_CHECKPOINTS_DIR:-../artifacts/models/checkpoints}
        target: /checkpoints
      - type: bind
        source: ${VIETDOC_DATASETS_DIR:-../datasets}
        target: /datasets
        read_only: true
      - type: bind
        source: ${VIETDOC_EVALUATION_DIR:-../artifacts/evaluation}
        target: /artifacts/evaluation
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: ${AI_TRAIN_CPUS:-4}
    # 12g default fits 16GB+ hosts while covering Qwen3-1.7B host load buffers and RTX 3060 12GB G0 runs.
    mem_limit: ${AI_TRAIN_MEMORY:-12g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Same environment with CUDA torch and the host NVIDIA GPU (Docker Desktop + WSL2).
  #   docker compose -f infra/compose.ai.yaml --profile gpu run --rm ai-train-gpu
  ai-train-gpu:
    <<: *train
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: infra/ai-train.Dockerfile
      args:
        TORCH_INDEX: ${AI_TRAIN_TORCH_INDEX:-cu126}
    image: vietdoc-ai-train:${AI_TRAIN_TORCH_INDEX:-cu126}
    environment:
      <<: *train-env
      # Reduce CUDA allocator fragmentation on 12GB VRAM cards (e.g., RTX 3060 12GB).
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True,max_split_size_mb:128}
    volumes: *train-volumes
    gpus: all
    shm_size: ${AI_TRAIN_SHM_SIZE:-2g}

secrets:
  ai_service_token:
    file: ${VIETDOC_SERVICE_TOKEN_PATH:-../secrets/ai_service_token}

volumes:
  ai-attempts:
