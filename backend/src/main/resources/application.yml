server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./runtime/vietdoc;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
vietdoc:
  storage: ${STORAGE_ROOT:./runtime/storage}
  mode: ${AI_MODE:manual}
  worker-enabled: ${WORKER_ENABLED:true}
  worker-url: ${AI_WORKER_URL:http://localhost:8090/extract}
  worker-token: ${AI_WORKER_TOKEN:}
  pipeline-manifest: ${PIPELINE_MANIFEST:manual.v1}
  seed-username: ${SEED_USERNAME:}
  seed-password: ${SEED_PASSWORD:}
  token-hours: ${TOKEN_HOURS:8}
  max-pixels: 20000000
  job-deadline-seconds: 180
  lease-seconds: 30
  max-attempts: 3
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
